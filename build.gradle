plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.0.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {

    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'

    compileOnly 'dev.jorel:commandapi-paper-core:12.1.0'
    compileOnly 'me.clip:placeholderapi:2.12.3'

    implementation 'de.exlll:configlib-yaml:4.8.1'
    implementation 'com.github.ez-plugins:mc-plugin-update-notifier:1.0.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
}

def targetJavaVersion = 25

java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set(' ')

    relocate 'org.bstats',           'ru.terracraft.info.libs.bstats'
    relocate 'de.exlll.configlib',   'ru.terracraft.info.libs.configlib'
    relocate 'com.github.ezplugins', 'ru.terracraft.info.libs.updater'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'

    mergeServiceFiles()
}

tasks.named('jar') {
    enabled = false
}

build.dependsOn shadowJar