# Ссылки. display — то, что видит игрок, url — куда ведёт клик.
links.header: "<gold><bold>🔗 Наши ссылки</bold></gold>"
links.entry_format: " <gray>•</gray> {display} <dark_gray>({url})</dark_gray>"
