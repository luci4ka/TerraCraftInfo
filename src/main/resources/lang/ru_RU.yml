prefix: "<gradient:#00c6ff:#0072ff><bold>TerraCraft</bold></gradient> <dark_gray>»</dark_gray> "

rules:
  header: "<gold><bold>📜 Правила сервера</bold></gold>"
  footer: "<gray>Незнание правил не освобождает от ответственности.</gray>"

info:
  header: "<gold><bold>ℹ Информация о сервере</bold></gold>"

help:
  header: "<gold><bold>❓ Помощь</bold></gold>"
  group_header: "<aqua><bold>▸ {group}</bold></aqua>"
  entry_format: " <gray>•</gray> <yellow>{cmd}</yellow> <gray>- {description}</gray>"
  aliases_format: " <dark_gray>({aliases})</dark_gray>"
  no_groups: "<gray>Нет доступных команд.</gray>"
  hover_click: "<gray>Нажми, чтобы вставить <white>{cmd}</white></gray>"

links:
  header: "<gold><bold>🔗 Наши ссылки</bold></gold>"
  entry_format: " <gray>•</gray> {display} <dark_gray>({url})</dark_gray>"
  hover_open: "<gray>Открыть: <white>{url}</white></gray>"

pagination:
  header: "<gold>─── {title} ({page}/{total}) ───</gold>"
  footer: "<gray>→ /{command} {next_page} для следующей страницы</gray>"
  next_label: "▶"
  prev_label: "◀"
  page_indicator: " {page} / {total} "
  hover_next: "<gray>Следующая страница</gray>"
  hover_prev: "<gray>Предыдущая страница</gray>"
  invalid: "<red>Неверный номер страницы.</red>"

error:
  player_only: "<red>Команда только для игроков.</red>"
  no_permission: "<red>Недостаточно прав.</red>"
  unknown_command: "<red>Неизвестная команда.</red>"

update:
  available: "<gold>⚡ Доступно обновление: <white>{version}</white> <gray>({url})</gray>"
  latest: "<green>✔ У вас последняя версия.</green>"
  error: "<red>Не удалось проверить обновления.</red>"